<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochila de Emergencia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .donation-btn {
            background-color: #ffb703;
            color: #023047;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.3s;
            margin-top: 20px;
        }
        .donation-btn:hover {
            background-color: #fb8500;
            color: #fff;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
        }
        .close-btn:hover {
            color: #000;
        }
        .alias-box {
            background-color: #e9ecef;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            margin: 15px 0;
            user-select: all;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h1>Bienvenido a la App de Emergencia</h1>
    <p>Aprende a preparar tu mochila y mantente seguro.</p>

    <!-- Botón con la frase amable -->
    <button class="donation-btn" onclick="openModal()">Si deseas apoyar mi proyecto</button>

    <!-- Ventana Modal -->
    <div id="donationModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3>¡Gracias de corazón por querer colaborar!</h3>
            <p>Tu aporte voluntario ayuda a que este proyecto educativo siga creciendo.</p>
            <p>Podes transferir al siguiente Alias:</p>
            <div class="alias-box" id="aliasText">AFERNANDE3387.NX.ARS</div>
            <button onclick="copyAlias()" style="padding: 8px 15px; background-color: #219ebc; color: white; border: none; border-radius: 5px; cursor: pointer;">Copiar Alias</button>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('donationModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('donationModal').style.display = 'none';
        }

        function copyAlias() {
            const aliasText = document.getElementById('aliasText').innerText;
            navigator.clipboard.writeText(aliasText).then(() => {
                alert('¡Alias copiado al portapapeles!');
            });
        }

        window.onclick = function(event) {
            const modal = document.getElementById('donationModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>

</body>
</html>
